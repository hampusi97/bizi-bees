version: "3.9"

services:
  autonomous-dropship-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bizibees-dropship-bot
    restart: unless-stopped
    environment:
      - TZ=UTC
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
