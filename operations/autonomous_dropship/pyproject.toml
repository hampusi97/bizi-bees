[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "database", "integrations", "modules", "scheduler"]

[project]
name = "shopify-autonomous-dropship"
version = "1.0.0"
description = "Autonomous Dropshipping & Multi-Channel Catalog Bot for Shopify (bizibees-store.myshopify.com)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Lead Autonomous Systems Architect", email = "architect@bizibees.internal" },
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.1",
    "rich>=13.9.0",
    "typer>=0.15.0",
    "apscheduler>=3.10.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
dropship-bot = "main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
