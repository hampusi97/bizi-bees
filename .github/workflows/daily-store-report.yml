name: Multi-Store Daily Performance Briefing

on:
  schedule:
    # 06:00 UTC daily (Midnight US Mountain Time / 02:00 AM Eastern)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force immediate report generation'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  generate-daily-operations-report:
    name: Generate & Publish Daily Operations Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Execute Daily Report Engine
        env:
          SHOPIFY_ADMIN_ACCESS_TOKEN_BIZI_BEES: ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN_BIZI_BEES || secrets.SHOPIFY_ADMIN_ACCESS_TOKEN_BIZIBEES || secrets.SHOPIFY_ADMIN_ACCESS_TOKEN }}
          SHOPIFY_STORE_BIZI_BEES_URL: ${{ secrets.SHOPIFY_STORE_BIZI_BEES_URL || secrets.SHOPIFY_STORE_BIZIBEES_URL || 'bizibees-store.myshopify.com' }}
          SHOPIFY_ADMIN_ACCESS_TOKEN_LUMA_CLINICAL: ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN_LUMA_CLINICAL || secrets.SHOPIFY_ADMIN_ACCESS_TOKEN_LUMA }}
          SHOPIFY_STORE_LUMA_CLINICAL_URL: ${{ secrets.SHOPIFY_STORE_LUMA_CLINICAL_URL || secrets.SHOPIFY_STORE_LUMA_URL || 'luma-clinical.myshopify.com' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          node scripts/generate-daily-report.mjs

      - name: Commit & Push Daily Audit Digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ README.md
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit. Report is already up to date."
          else
            TODAY=$(date -u +%Y-%m-%d)
            git commit -m "[automated] Daily Stores Report - ${TODAY} [skip ci]"
            git push origin main
          fi
