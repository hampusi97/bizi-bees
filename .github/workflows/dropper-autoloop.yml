name: 🤖 Dropper OS Autonomous Fleet Reporter & Daemon

on:
  schedule:
    - cron: '0 0 * * *' # Midnight 00:00 UTC Daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-fleet-reporter:
    name: Execute Daily Telemetry & Digest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dropper OS Dependencies
        working-directory: ./dropper-os
        run: |
          npm ci || npm install

      - name: Execute Daily Report Generator
        working-directory: ./dropper-os
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          BIZI_BEES_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN }}
        run: |
          npx tsx scripts/run-daily-report.ts

      - name: Commit & Push Daily Reports to Main
        run: |
          git config user.name "Dropper OS Bot"
          git config user.email "dropper@bizibees.com"
          git add dropper-os/reports/ README.md || true
          if git diff --staged --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "chore(dropper): automated daily fleet intelligence digest [skip ci]"
            git push origin main
          fi
