name: Autonomous 24/7 SEO, Backlink & Indexing Engine

on:
  schedule:
    # Run every 3 hours automatically round-the-clock
    - cron: '0 */3 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-seo-and-indexing-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Execute Autonomous SEO, Backlink & Indexing Engine
        run: |
          ruby operations/autonomous_seo_engine.rb

      - name: Commit and Push Updated Catalog, Backlink Directory & SEO Audit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add directory.html rss.xml sitemap.xml operations/seo_backlink_health_report.json operations/predictive_catalog_database.json content/blog-posts/ content/trending_articles_shopify_import.csv content/autonomous_dropship_curator.csv || true
          if git diff --staged --quiet; then
            echo "No directory, catalog, article, or SEO changes to commit."
          else
            git commit -m "Auto-curate dropship winners, prune weak items & refresh High-DA backlinks [skip ci]"
            git push
          fi
