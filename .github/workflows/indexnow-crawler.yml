name: Autonomous Search Engine Indexer & Click Hunter

on:
  schedule:
    # Run every 4 hours automatically 24/7/365 in the cloud
    - cron: '0 */4 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ping-search-engines:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Run Autonomous Indexer & WebSub Broadcast
        run: |
          ruby operations/customer_hunter.rb
