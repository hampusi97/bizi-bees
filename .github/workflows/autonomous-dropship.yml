name: Autonomous Dropship & Multi-Channel Catalog Bot

on:
  schedule:
    # 02:00 AM UTC (TrendScout)
    - cron: '0 2 * * *'
    # 03:00 AM UTC (EconVetter)
    - cron: '0 3 * * *'
    # 04:00 AM UTC (CreativeDirector)
    - cron: '0 4 * * *'
    # 05:00 AM UTC (CatalogJanitor)
    - cron: '0 5 * * *'
    # 06:00 AM UTC (Daily Executive Briefing)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Pipeline stage to execute'
        required: true
        default: 'run-pipeline'
        type: choice
        options:
          - run-pipeline
          - run-scout
          - run-vetter
          - run-creative
          - run-janitor
          - audit-only
      auto_publish:
        description: 'Autopilot Live Mode (true = ACTIVE live on store; false = DRAFT safe mode)'
        required: true
        default: false
        type: boolean

concurrency:
  group: autonomous-dropship
  cancel-in-progress: false

jobs:
  execute-pipeline:
    name: Execute Autonomous Sub-Agent Stage
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        working-directory: operations/autonomous_dropship
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Determine Stage & Autopilot State
        id: config
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ACTION="${{ github.event.inputs.action }}"
            AUTO_PUB="${{ github.event.inputs.auto_publish }}"
          else
            HOUR=$(date -u +%H)
            case "$HOUR" in
              "02") ACTION="run-scout" ;;
              "03") ACTION="run-vetter" ;;
              "04") ACTION="run-creative" ;;
              "05") ACTION="run-janitor" ;;
              "06") ACTION="run-pipeline" ;;
              *) ACTION="run-pipeline" ;;
            esac
            AUTO_PUB="false"
          fi
          echo "action=$ACTION" >> $GITHUB_OUTPUT
          echo "auto_publish=$AUTO_PUB" >> $GITHUB_OUTPUT

      - name: Execute Autonomous Dropship Stage
        working-directory: operations/autonomous_dropship
        env:
          SHOPIFY_SHOP_DOMAIN: ${{ secrets.SHOPIFY_SHOP_DOMAIN || 'bizibees-store.myshopify.com' }}
          SHOPIFY_ADMIN_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN || '' }}
          AUTOPILOT_AUTO_PUBLISH: ${{ steps.config.outputs.auto_publish }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}
          TIKTOK_BUSINESS_API_KEY: ${{ secrets.TIKTOK_BUSINESS_API_KEY || '' }}
          META_MARKETING_API_KEY: ${{ secrets.META_MARKETING_API_KEY || '' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL || '' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '' }}
        run: |
          ACTION="${{ steps.config.outputs.action }}"
          echo "Running Dropship Bot: $ACTION"
          if [ "$ACTION" = "run-pipeline" ]; then
            python main.py run-pipeline 2>&1 | tee execution.log
          elif [ "$ACTION" = "run-scout" ]; then
            python main.py run-scout 2>&1 | tee execution.log
          elif [ "$ACTION" = "run-vetter" ]; then
            python main.py run-vetter 2>&1 | tee execution.log
          elif [ "$ACTION" = "run-creative" ]; then
            python main.py run-creative 2>&1 | tee execution.log
          elif [ "$ACTION" = "run-janitor" ]; then
            python main.py run-janitor 2>&1 | tee execution.log
          elif [ "$ACTION" = "audit-only" ]; then
            python main.py run-janitor --prune-only 2>&1 | tee execution.log
          fi

      - name: Publish Job Summary to GitHub Actions
        working-directory: operations/autonomous_dropship
        run: |
          echo "## 🐝 Bizibees Autonomous Dropship Bot — Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Trigger:** \`${{ github.event_name }}\` | **Action:** \`${{ steps.config.outputs.action }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Store:** \`bizibees-store.myshopify.com\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat execution.log | grep -E '\[INFO\]|🚀|•|✅|Score:|APPROVED|Ingested|REJECTED' | tail -n 40 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Commit State Changes (if updated)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add operations/autonomous_dropship/data/
          if git diff --staged --quiet; then
            echo "No database state changes to commit."
          else
            git commit -m "chore(autonomous): update catalog & queue state [skip ci]"
            git push origin main
          fi
