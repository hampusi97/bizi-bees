name: Autonomous E-Commerce Self-Healing & Trend Engine

on:
  schedule:
    # Runs automatically every single night at 03:00 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows you to click "Run workflow" manually anytime

concurrency:
  group: self-healing-engine
  cancel-in-progress: false

jobs:
  audit-rebrand-and-seed:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Network & API Tools
        run: pip install requests

      - name: Execute Autonomous Brand & Research Loop
        env:
          SHOPIFY_SHOP_URL: ${{ secrets.SHOPIFY_SHOP_URL || 'bizibees-store.myshopify.com' }}
          SHOPIFY_ADMIN_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN || '' }}
        run: |
          python scripts/autonomous_engine.py

      - name: Publish Summary to GitHub Actions Step Summary
        run: |
          cat REPORTS_DAILY_AUDIT.md >> $GITHUB_STEP_SUMMARY

      - name: Commit Autonomous Daily Audit Report to GitHub
        run: |
          git config --global user.name "Luma-Autonomous-Bot"
          git config --global user.email "bot@lumaclinical.internal"
          git add REPORTS_DAILY_AUDIT.md
          if git diff --staged --quiet; then
            echo "No audit report changes to commit."
          else
            git commit -m "chore: autonomous catalog audit and rebrand updates [skip ci]" || exit 0
            git push origin main
          fi
