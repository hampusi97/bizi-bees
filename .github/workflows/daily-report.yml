name: Daily Store Performance Report

on:
  schedule:
    - cron: '0 6 * * *' # Runs daily at 06:00 UTC
  workflow_dispatch:     # Allows manual trigger anytime from GitHub UI

permissions:
  contents: write        # CRITICAL: Grants permission to push commits to main

jobs:
  generate-and-push-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install || true

      - name: Generate Daily Report
        env:
          SHOPIFY_API_TOKENS: ${{ secrets.SHOPIFY_API_TOKENS }}
          SHOPIFY_ADMIN_ACCESS_TOKEN_BIZI_BEES: ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN_BIZI_BEES || secrets.SHOPIFY_ADMIN_ACCESS_TOKEN_BIZIBEES || secrets.SHOPIFY_ADMIN_ACCESS_TOKEN }}
          SHOPIFY_STORE_BIZI_BEES_URL: ${{ secrets.SHOPIFY_STORE_BIZI_BEES_URL || secrets.SHOPIFY_STORE_BIZIBEES_URL || 'bizibees-store.myshopify.com' }}
          SHOPIFY_ADMIN_ACCESS_TOKEN_LUMA_CLINICAL: ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN_LUMA_CLINICAL || secrets.SHOPIFY_ADMIN_ACCESS_TOKEN_LUMA }}
          SHOPIFY_STORE_LUMA_CLINICAL_URL: ${{ secrets.SHOPIFY_STORE_LUMA_CLINICAL_URL || secrets.SHOPIFY_STORE_LUMA_URL || 'luma-clinical.myshopify.com' }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/generate-daily-report.mjs

      - name: Commit and Push Report to GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ README.md
          if git diff --staged --quiet; then
            echo "No changes to commit for today's report."
          else
            git commit -m "chore(report): automated daily store report [$(date +'%Y-%m-%d')]"
            git push origin main
          fi
