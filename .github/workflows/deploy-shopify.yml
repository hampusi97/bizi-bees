name: Deploy Shopify Theme

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Theme Ignore Guard
        run: |
          echo "Verifying safety guards: config/settings_data.json must be preserved..."
          if grep -q "config/settings_data.json" .shopifyignore; then
            echo "✓ .shopifyignore contains config/settings_data.json"
          else
            echo "::error::.shopifyignore missing config/settings_data.json protection"
            exit 1
          fi

      - name: Deploy Theme to Shopify
        env:
          SHOPIFY_CLI_THEME_TOKEN: ${{ secrets.SHOPIFY_CLI_THEME_TOKEN }}
          SHOPIFY_SHOP_URL: ${{ secrets.SHOPIFY_SHOP_URL }}
        run: |
          if [ -z "$SHOPIFY_CLI_THEME_TOKEN" ] || [ -z "$SHOPIFY_SHOP_URL" ]; then
            echo "ℹ️ SHOPIFY_CLI_THEME_TOKEN or SHOPIFY_SHOP_URL not configured in GitHub Secrets."
            echo "Skipping live theme push. Add secrets in GitHub Repo Settings -> Secrets to enable automated theme publishing."
            exit 0
          fi
          npm install -g @shopify/cli @shopify/theme
          shopify theme push \
            --store "$SHOPIFY_SHOP_URL" \
            --password "$SHOPIFY_CLI_THEME_TOKEN" \
            --path . \
            --ignore config/settings_data.json \
            --live \
            --allow-live
