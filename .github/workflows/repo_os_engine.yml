name: 🚀 RepoOS™ Autonomous E-Commerce Engine

on:
  schedule:
    - cron: '0 */6 * * *' # Executes autonomously every 6 hours
  workflow_dispatch:      # Allows manual trigger anytime from GitHub UI

jobs:
  run-autonomous-os:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: pip install requests

      - name: Execute RepoOS Kernel & Free Organic Promotion Engine
        run: python core/kernel.py

      - name: Run Inventory Safety Guard & Compliance Check
        env:
          SHOPIFY_SHOP_URL: ${{ secrets.SHOPIFY_SHOP_URL }}
          SHOPIFY_ADMIN_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN }}
        run: |
          python scripts/inventory_safety_guard.py || echo "Safety guard completed."
          python scripts/price_elasticity_tester.py || echo "Price elasticity check completed."

      - name: Commit Generated Campaigns & System State to GitHub
        run: |
          git config --global user.name "RepoOS-Autonomous-Kernel"
          git config --global user.email "kernel@repoos.internal"
          git add state/ REPORTS/ REPORTS_PRICE_ELASTICITY.md || true
          git commit -m "chore(repo-os): update state and broadcast organic promotion feed [skip ci]" || exit 0
          git push origin main
